type: custom:dashboard-sidebar-card
dashboard_sidebar:
  position: left
  width: 288
  start_collapsed: false

  # Layered background: two colored light-sources over a deep gradient base.
  background: >-
    radial-gradient(120% 80% at 15% -10%, rgba(167,139,250,0.55) 0%, rgba(167,139,250,0) 58%),
    radial-gradient(90% 55% at 110% 105%, rgba(34,211,238,0.40) 0%, rgba(34,211,238,0) 55%),
    linear-gradient(165deg, #0a0f1f 0%, #141a35 48%, #1d1236 100%)

  card_mod:
    style: |
      .dashboard-sidebar-root {
        border-right: 1px solid rgba(148,163,184,0.18);
        box-shadow: inset 0 0 70px rgba(124,58,237,0.28);
      }

      /* Animated gradient sweep across the title text. */
      .dashboard-sidebar-title {
        background: linear-gradient(90deg,#a78bfa,#22d3ee,#f0abfc,#a78bfa);
        background-size: 300% auto;
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
        letter-spacing: 0.20em;
        font-weight: 800;
        animation: sweep 7s linear infinite;
      }
      @keyframes sweep { to { background-position: 300% center; } }

      .dashboard-sidebar-clock {
        font-variant-numeric: tabular-nums;
        text-shadow: 0 0 18px rgba(125,211,252,0.55);
        font-weight: 700;
      }

      .dashboard-sidebar-item {
        border-radius: 12px;
        transition: background 180ms ease, transform 180ms ease;
      }
      .dashboard-sidebar-item:hover {
        background: rgba(167,139,250,0.16);
        transform: translateX(2px);
      }

      .dashboard-sidebar-category-header {
        text-transform: uppercase;
        letter-spacing: 0.12em;
        font-size: 0.72rem;
        opacity: 0.85;
      }

      .dashboard-sidebar-footer-btn {
        border-radius: 999px;
        background: rgba(148,163,184,0.10);
        border: 1px solid rgba(148,163,184,0.18);
      }
      .dashboard-sidebar-footer-btn:hover {
        background: rgba(34,211,238,0.18);
        box-shadow: 0 0 16px rgba(34,211,238,0.35);
      }

  header:
    - type: title
      text: SIMULACREAN
      align: center
      text_color: "#e9d5ff"

    - type: clock
      format: "%-I:%M %p"
      align: center
      text_color: "#7dd3fc"

    - type: date
      format: "%A, %B %-d"
      align: center
      text_color: "#94a3b8"

    - type: divider
      color: rgba(148,163,184,0.30)

  body:
    - type: item
      title: Overview
      icon: mdi:view-dashboard-variant
      icon_color: "#38bdf8"
      text_color: "#e2e8f0"
      tap_action:
        action: navigate
        navigation_path: /lovelace/0

    - type: item
      title: Energy
      icon: mdi:lightning-bolt
      icon_color: "#facc15"
      text_color: "#e2e8f0"
      tap_action:
        action: navigate
        navigation_path: /energy

    - type: category
      title: Rooms
      text_color: "#cbd5e1"
      icon: mdi:sofa
      icon_color: "#a78bfa"
      start_collapsed: false
      guide_line: true
      items:
        - title: Living Room
          text_color: "#e2e8f0"
          icon: mdi:television-classic
          icon_color: "#f0abfc"
          tap_action:
            action: navigate
            navigation_path: /lovelace/living-room
        - title: Kitchen
          text_color: "#e2e8f0"
          icon: mdi:silverware-fork-knife
          icon_color: "#fb7185"
          tap_action:
            action: navigate
            navigation_path: /lovelace/kitchen
        - title: Basement
          text_color: "#e2e8f0"
          icon: mdi:stairs-down
          icon_color: "#22d3ee"
          tap_action:
            action: navigate
            navigation_path: /lovelace/basement

    - type: category
      title: Garden
      text_color: "#cbd5e1"
      icon: mdi:sprout
      icon_color: "#4ade80"
      start_collapsed: true
      items:
        - title: Irrigation
          text_color: "#e2e8f0"
          icon: mdi:water
          icon_color: "#38bdf8"
          tap_action:
            action: navigate
            navigation_path: /lovelace/garden
        - title: Grow Lights
          text_color: "#e2e8f0"
          icon: mdi:lightbulb-on-outline
          icon_color: "#fde047"
          entity: light.grow_lights
          tap_action:
            action: toggle

    - type: divider
      color: rgba(148,163,184,0.20)

    - type: markdown
      align: center
      text_color: "#cbd5e1"
      content: >-
        **{{ states('sensor.lights_on') }}** lights on

    - type: card
      align: center
      background: rgba(15,23,42,0.45)
      card:
        type: gauge
        entity: sensor.living_room_temperature
        name: Living Room
        min: 50
        max: 90
        severity:
          green: 62
          yellow: 76
          red: 84

  footer:
    divider: true
    buttons:
      - icon: mdi:home
        icon_color: "#38bdf8"
        title: Home
        tap_action:
          action: navigate
          navigation_path: /lovelace/0
      - icon: mdi:lightbulb-group
        icon_color: "#fde047"
        title: All lights
        entity: light.all_lights
        tap_action:
          action: toggle
      - icon: mdi:thermostat
        icon_color: "#fb7185"
        title: Climate
        tap_action:
          action: navigate
          navigation_path: /lovelace/climate
      - icon: mdi:cog
        icon_color: "#94a3b8"
        title: Settings
        tap_action:
          action: navigate
          navigation_path: /config/dashboard
